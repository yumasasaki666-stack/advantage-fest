<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="アドフェス 当日の物販・出展情報">
    <title>EXHIBITORS & SHOPS | アドフェス</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
    <style>

        /* ===========================
           HERO
        =========================== */
        .shop-hero {
            padding: 160px 0 80px;
            text-align: center;
            position: relative;
            background: #050505;
            overflow: hidden;
        }
        .shop-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(180,0,0,0.18) 0%, transparent 70%),
                url('logo.png') center/700px no-repeat;
            opacity: 0.08;
            pointer-events: none;
        }
        .shop-hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-color) 30%, var(--secondary-color) 50%, var(--primary-color) 70%, transparent);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .shop-hero-inner {
            position: relative;
            z-index: 2;
        }
        .shop-hero h1 {
            font-size: clamp(2.4rem, 6vw, 4.5rem);
            font-family: var(--font-heading);
            color: #fff;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(255,215,0,0.2);
        }
        .shop-hero h1 span {
            display: block;
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--primary-color);
            letter-spacing: 0.25em;
            margin-top: 0.6rem;
            font-weight: 700;
        }
        .shop-hero .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2.5rem;
            padding: 0.75rem 2rem;
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--secondary-color);
            border: 1px solid rgba(255,215,0,0.4);
            background: rgba(255,215,0,0.06);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .shop-hero .btn-back:hover {
            background: rgba(255,215,0,0.14);
            border-color: var(--secondary-color);
            box-shadow: 0 0 20px var(--secondary-glow);
            color: #fff;
        }
        .shop-hero .btn-back svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ===========================
           SECTION LEAD
        =========================== */
        .shop-lead {
            text-align: center;
            margin-bottom: 4rem;
        }
        .shop-lead-title {
            display: inline-flex;
            align-items: center;
            gap: 1.5rem;
            font-family: var(--font-heading);
            font-size: 1.05rem;
            letter-spacing: 0.25em;
            color: var(--secondary-color);
            text-transform: uppercase;
        }
        .shop-lead-title::before,
        .shop-lead-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--secondary-color));
        }
        .shop-lead-title::after {
            background: linear-gradient(90deg, var(--secondary-color), transparent);
        }

        /* ===========================
           GRID
        =========================== */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
        }
        @media (max-width: 680px) {
            .shop-grid { grid-template-columns: 1fr; gap: 2rem; }
        }

        /* ===========================
           CARD
        =========================== */
        .shop-card {
            background: #0d0d0d;
            border: 1px solid #1e1e1e;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .shop-card:hover {
            transform: translateY(-8px);
            border-color: rgba(230,0,0,0.5);
            box-shadow:
                0 20px 50px rgba(0,0,0,0.7),
                0 0 25px rgba(230,0,0,0.12);
        }
        /* Top accent bar – animates on hover */
        .shop-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }
        .shop-card:hover::before { transform: scaleX(1); }

        /* ---- image carousel area ---- */
        .card-carousel {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #070707;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .card-carousel-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease, filter 0.5s ease;
            user-select: none;
            -webkit-user-drag: none;
        }
        .shop-card:hover .card-carousel-img {
            transform: scale(1.03);
            filter: drop-shadow(0 0 16px rgba(255,215,0,0.2));
        }

        /* Carousel arrows */
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            background: rgba(10,10,10,0.75);
            border: 1px solid rgba(230,0,0,0.6);
            border-radius: 50%;
            color: #fff;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.25s ease;
            opacity: 0;
            backdrop-filter: blur(4px);
        }
        .shop-card:hover .carousel-arrow { opacity: 0.9; }
        .carousel-arrow:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            opacity: 1 !important;
            box-shadow: 0 0 14px var(--primary-glow);
        }
        .carousel-arrow.prev { left: 10px; }
        .carousel-arrow.next { right: 10px; }

        /* Dots */
        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 7px;
            z-index: 10;
        }
        .carousel-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .carousel-dot.active {
            background: var(--secondary-color);
            box-shadow: 0 0 8px var(--secondary-glow);
            transform: scale(1.4);
        }

        /* "Click to expand" hint overlay */
        .card-expand-hint {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 0.5rem 0;
            text-align: center;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.55);
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
            text-transform: uppercase;
        }
        .shop-card:hover .card-expand-hint { opacity: 1; }

        /* ---- card info ---- */
        .card-info {
            padding: 1.4rem 1.8rem 1.8rem;
            border-top: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .card-name {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            color: #fff;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255,255,255,0.1);
            flex: 1;
        }
        .card-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.85rem;
            border: 1px solid rgba(255,215,0,0.35);
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--secondary-color);
            white-space: nowrap;
            background: rgba(255,215,0,0.05);
            flex-shrink: 0;
        }

        /* ===========================
           NOTES
        =========================== */
        .shop-notes-section {
            margin-top: 6rem;
            border-top: 1px solid #1a1a1a;
            padding-top: 4rem;
        }
        .shop-notes-box {
            max-width: 760px;
            margin: 0 auto;
            background: #0a0a0a;
            border: 1px solid #1e1e1e;
            border-left: 3px solid var(--secondary-color);
            border-radius: 4px;
            padding: 2.2rem 2.8rem;
        }
        @media (max-width: 600px) {
            .shop-notes-box { padding: 1.5rem 1.5rem; }
        }
        .shop-notes-box h2 {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            color: var(--secondary-color);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }
        .shop-notes-box p {
            font-size: 0.95rem;
            color: #aaa;
            line-height: 2;
        }
        .shop-notes-box p + p { margin-top: 0.6rem; }

        /* ===========================
           MODAL
        =========================== */
        .gallery-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }
        .gallery-modal.active { display: flex; }
        .gallery-modal.active .gallery-modal-content {
            animation: modalIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .gallery-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .gallery-modal-content {
            position: relative;
            width: min(92vw, 1100px);
            z-index: 1;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-top: 3px solid var(--primary-color);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 40px rgba(230,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .gallery-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #1e1e1e;
            background: #0a0a0a;
            gap: 1rem;
        }
        .gallery-company {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            color: #fff;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .gallery-meta {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }
        .gallery-counter-badge {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--secondary-color);
            background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.25);
            padding: 0.3rem 0.8rem;
            border-radius: 2px;
        }
        .gallery-close {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #aaa;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            line-height: 1;
            flex-shrink: 0;
        }
        .gallery-close:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .gallery-image-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #060606;
            min-height: 300px;
        }
        #gallery-img {
            display: block;
            max-width: 100%;
            max-height: 72vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }
        .gallery-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px; height: 52px;
            background: rgba(10,10,10,0.8);
            border: 1px solid rgba(230,0,0,0.5);
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }
        .gallery-nav-btn:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .gallery-nav-btn.prev { left: 16px; }
        .gallery-nav-btn.next { right: 16px; }
        .gallery-dots-wrap {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 1.1rem 1.5rem;
            border-top: 1px solid #161616;
            background: #080808;
        }
        .gallery-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #333;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid #444;
        }
        .gallery-dot.active {
            background: var(--secondary-color);
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px var(--secondary-glow);
            transform: scale(1.3);
        }
        @media (max-width: 600px) {
            .gallery-nav-btn { width: 44px; height: 44px; font-size: 1rem; }
            .gallery-nav-btn.prev { left: 8px; }
            .gallery-nav-btn.next { right: 8px; }
            .gallery-topbar { padding: 0.8rem 1rem; }
            .gallery-company { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <main>
        <!-- HERO -->
        <section class="shop-hero">
            <div class="container shop-hero-inner">
                <h1>EXHIBITORS & SHOPS<span>当日の物販・出展情報</span></h1>

                    <svg viewBox="0 0 16 16"><path d="M11 1L4 8l7 7"/></svg>

        <section class="section">

                <div class="shop-lead">

    <!-- GALLERY MODAL -->
    <div id="gallery-modal" class="gallery-modal" role="dialog" aria-modal="true">
        <div class="gallery-overlay" id="gallery-overlay"></div>
        <div class="gallery-modal-content">
            <div class="gallery-topbar">
                <div class="gallery-meta">
                    <span class="gallery-company" id="gallery-company-name"></span>
                    <span class="gallery-counter-badge" id="gallery-counter"></span>
                </div>
                <button class="gallery-close" id="gallery-close" aria-label="閉じる">&times;</button>
            </div>
            <div class="gallery-image-wrap" id="gallery-image-wrap">
                <button class="gallery-nav-btn prev" id="gallery-prev" aria-label="前の画像">&#10094;</button>
                <img id="gallery-img" src="" alt="POP画像">
                <button class="gallery-nav-btn next" id="gallery-next" aria-label="次の画像">&#10095;</button>
            </div>
            <div class="gallery-dots-wrap" id="gallery-dots"></div>
        </div>
    </div>

    <script>
        // ─── 画像データ ──────────────────────────────
        const companyImages = [
            {
                name: "トレカキャンプ",
                images: ["pop-A01.png"]
            },
            {
                name: "カドラバ",
                images: ["pop-B01.png"]
            },
            {
                name: "DMMマイカ",
                images: ["pop-C01.png", "pop-C02.jpg"]
            },
            {
                name: "TOYGER",
                images: ["pop-D01.png"]
            },
            {
                name: "アドバンテージ",
                images: ["pop-E01.png"]
            }
        ];
        // ────────────────────────────────────────────

        document.addEventListener('DOMContentLoaded', () => {
            const grid      = document.getElementById('shop-card-grid');
            const modal     = document.getElementById('gallery-modal');
            const modalImg  = document.getElementById('gallery-img');
            const modalName = document.getElementById('gallery-company-name');
            const modalCnt  = document.getElementById('gallery-counter');
            const dotsWrap  = document.getElementById('gallery-dots');
            const prevBtn   = document.getElementById('gallery-prev');
            const nextBtn   = document.getElementById('gallery-next');
            const closeBtn  = document.getElementById('gallery-close');
            const overlay   = document.getElementById('gallery-overlay');

            let curCo = -1, curImg = -1;
            const cardStates = new Array(companyImages.length).fill(0);

            // ── カード生成 ──────────────────────────
            companyImages.forEach((co, ci) => {
                const card = document.createElement('div');
                card.className = 'shop-card fade-in';
                card.onclick = () => openModal(ci, cardStates[ci]);

                // ── carousel ──
                const carousel = document.createElement('div');
                carousel.className = 'card-carousel';

                const img = document.createElement('img');
                img.src = co.images[0];
                img.alt = co.name;
                img.className = 'card-carousel-img';
                img.draggable = false;
                carousel.appendChild(img);

                if (co.images.length > 1) {
                    // arrows
                    const makeArrow = (dir) => {
                        const btn = document.createElement('button');
                        btn.className = `carousel-arrow ${dir}`;
                        btn.innerHTML = dir === 'prev' ? '&#10094;' : '&#10095;';
                        btn.setAttribute('aria-label', dir === 'prev' ? '前の画像' : '次の画像');
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            const len = co.images.length;
                            cardStates[ci] = dir === 'prev'
                                ? (cardStates[ci] - 1 + len) % len
                                : (cardStates[ci] + 1) % len;
                            syncCard(ci, carousel, co);
                        };
                        return btn;
                    };
                    carousel.appendChild(makeArrow('prev'));
                    carousel.appendChild(makeArrow('next'));

                    // dots
                    const dotsEl = document.createElement('div');
                    dotsEl.className = 'carousel-dots';
                    co.images.forEach((_, ii) => {
                        const d = document.createElement('div');
                        d.className = 'carousel-dot' + (ii === 0 ? ' active' : '');
                        d.onclick = (e) => {
                            e.stopPropagation();
                            cardStates[ci] = ii;
                            syncCard(ci, carousel, co);
                        };
                        dotsEl.appendChild(d);
                    });
                    carousel.appendChild(dotsEl);

                    // swipe on card
                    let tx = 0;
                    carousel.addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; }, {passive:true});
                    carousel.addEventListener('touchend', e => {
                        const diff = tx - e.changedTouches[0].screenX;
                        if (Math.abs(diff) > 40) {
                            const len = co.images.length;
                            cardStates[ci] = diff > 0
                                ? (cardStates[ci] + 1) % len
                                : (cardStates[ci] - 1 + len) % len;
                            syncCard(ci, carousel, co);
                        }
                        e.stopPropagation();
                    }, {passive:true});
                }



                // ── card info ──
                const info = document.createElement('div');
                info.className = 'card-info';

                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = co.name;

                info.appendChild(name);

                card.appendChild(carousel);
                card.appendChild(info);
                grid.appendChild(card);
            });

            // ── カード画像・ドット同期 ──────────────
            function syncCard(ci, carousel, co) {
                carousel.querySelector('.card-carousel-img').src = co.images[cardStates[ci]];
                carousel.querySelectorAll('.carousel-dot').forEach((d, i) => {
                    d.classList.toggle('active', i === cardStates[ci]);
                });
            }

            // ── モーダル ────────────────────────────
            function openModal(ci, startIdx = 0) {
                curCo = ci; curImg = startIdx;
                refreshModal();
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }

            function refreshModal() {
                const co = companyImages[curCo];
                modalImg.src = co.images[curImg];
                modalName.textContent = co.name;
                modalCnt.textContent  = `${curImg + 1} / ${co.images.length}`;

                const multi = co.images.length > 1;
                prevBtn.style.display = multi ? 'flex' : 'none';
                nextBtn.style.display = multi ? 'flex' : 'none';

                // rebuild modal dots
                dotsWrap.innerHTML = '';
                if (multi) {
                    co.images.forEach((_, i) => {
                        const d = document.createElement('div');
                        d.className = 'gallery-dot' + (i === curImg ? ' active' : '');
                        d.onclick = () => { curImg = i; refreshModal(); };
                        dotsWrap.appendChild(d);
                    });
                }

                // sync card state
                cardStates[curCo] = curImg;
                const carousel = grid.children[curCo].querySelector('.card-carousel');
                if (carousel) syncCard(curCo, carousel, co);
            }

            function step(dir) {
                const len = companyImages[curCo].images.length;
                curImg = (curImg + dir + len) % len;
                refreshModal();
            }

            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', closeModal);
            prevBtn.addEventListener('click', () => step(-1));
            nextBtn.addEventListener('click', () => step(1));

            document.addEventListener('keydown', e => {
                if (!modal.classList.contains('active')) return;
                if (e.key === 'Escape')     closeModal();
                if (e.key === 'ArrowLeft')  step(-1);
                if (e.key === 'ArrowRight') step(1);
            });

            // modal swipe
            let mx = 0;
            document.getElementById('gallery-image-wrap').addEventListener('touchstart', e => {
                mx = e.changedTouches[0].screenX;
            }, {passive:true});
            document.getElementById('gallery-image-wrap').addEventListener('touchend', e => {
                const diff = mx - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 50) step(diff > 0 ? 1 : -1);
            }, {passive:true});
        });
    </script>
</body>
</html>
